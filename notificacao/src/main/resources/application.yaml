spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 30000
          writetimeout: 5000

  thymeleaf:
    enable: true

envio:
  email:
   remetente: ${MAIL_REMETENTE:noreply@example.com}
   nomeRemetente: ${MAIL_NOME_REMETENTE:Agendador de tarefas}


server:
  port: 8082
