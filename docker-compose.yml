# Sobe a aplicação completa com um único comando:
#   docker compose up --build
# Porta de entrada para o cliente: BFF em http://localhost:8083/swagger-ui.html

services:

  postgres:
    # PostgreSQL fixado por ser uma versão mais estável em diversos ambientes
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_usuario
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_usuario"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    # MongoDB 7 fixado devido à incompatibilidade do MongoDB 8 com o kernel Linux 6.19
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: db_agendador
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  usuario:
    build: ./usuario
    image: agendador/usuario:latest
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_usuario
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-chave-apenas-para-desenvolvimento-local-troque-no-arquivo-env}
    depends_on:
      postgres:
        condition: service_healthy

  agendador-tarefas:
    build: ./agendador-tarefas
    image: agendador/agendador-tarefas:latest
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/db_agendador
      USUARIO_URL: http://usuario:8080/usuario
      JWT_SECRET: ${JWT_SECRET:-chave-apenas-para-desenvolvimento-local-troque-no-arquivo-env}
    depends_on:
      mongo:
        condition: service_healthy
      usuario:
        condition: service_started

  notificacao:
    build: ./notificacao
    image: agendador/notificacao:latest
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_REMETENTE: ${MAIL_REMETENTE:-noreply@example.com}
      MAIL_NOME_REMETENTE: ${MAIL_NOME_REMETENTE:-Agendador de Tarefas}

  bff-agendador-tarefas:
    build: ./bff-agendador-tarefas
    image: agendador/bff-agendador-tarefas:latest
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      USUARIO_URL: http://usuario:8080/usuario
      AGENDADOR_TAREFAS_URL: http://agendador-tarefas:8081/tarefas
      NOTIFICACAO_URL: http://notificacao:8082/email
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-1234}
    depends_on:
      - usuario
      - agendador-tarefas
      - notificacao

  # Cria o usuário técnico que a rotina agendada do BFF usa para buscar
  # tarefas e disparar notificações. Roda uma vez e encerra.
  seed-usuario-admin:
    image: curlimages/curl:8.10.1
    restart: "no"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-1234}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Aguardando o serviço de usuário..."
        until curl -s -o /dev/null http://usuario:8080/usuario/login; do sleep 3; done
        status=$$(curl -s -o /dev/null -w '%{http_code}' -X POST http://usuario:8080/usuario \
          -H 'Content-Type: application/json' \
          -d "{\"nome\":\"Administrador\",\"email\":\"$${ADMIN_EMAIL}\",\"senha\":\"$${ADMIN_SENHA}\"}")
        echo "Cadastro do usuário técnico: HTTP $$status (409 significa que ele já existia)"
    depends_on:
      - usuario

volumes:
  postgres-data:
  mongo-data:
